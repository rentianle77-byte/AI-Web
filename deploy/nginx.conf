# 快递管家 —— nginx 站点配置
# 放到 /etc/nginx/conf.d/express-agent.conf,然后 nginx -t && systemctl reload nginx
#
# 关键点:/api 必须关掉缓冲,否则流式对话和主动跟进推送会卡住不出字。

server {
    listen 80;
    server_name 120.55.242.165;   # 有域名就换成域名

    # 前端:vite build 产物
    root /opt/express-agent/frontend/dist;
    index index.html;

    # Vue 单页应用,刷新子路径不要 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ↓↓↓ SSE 必需:不关这几项,聊天会"憋"到最后才一次性吐出来,
        #     主动跟进的实时推送也收不到
        proxy_buffering      off;
        proxy_cache          off;
        chunked_transfer_encoding off;
        proxy_read_timeout   600s;   # 大模型思考久,别过早断开
        proxy_send_timeout   600s;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}
